[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "webposto-service"
version = "0.1.0"
description = "Serviço production-ready que sincroniza dados da API REST do webPosto"
authors = ["Grupo Lisboa <mlisboa17@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
# Web Framework
fastapi = "^0.104.0"
uvicorn = {version = "^0.24.0", extras = ["standard"]}
# Data Validation
pydantic = "^2.4.0"
pydantic-settings = "^2.0.0"
# Database
sqlalchemy = "^2.0.23"
alembic = "^1.12.1"
psycopg2-binary = "^2.9.9"
# HTTP Client
httpx = "^0.25.0"
tenacity = "^8.2.3"
# Cache & Events
redis = "^5.0.0"
# Logging
structlog = "^23.2.0"
python-json-logger = "^2.0.7"
# CLI
click = "^8.1.7"
pendulum = "^2.1.2"
aiosqlite = "^0.22.1"
python-dotenv = "^1.0.0"
tzdata = ">=2025.2"
celery = {version = "^5.3.0", optional = true}
PyJWT = "^2.9.0"

[tool.poetry.extras]
worker = ["celery"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
responses = "^0.24.1"
testcontainers = "^3.7.0"
faker = "^20.1.0"
factory-boy = "^3.3.0"
black = "^23.12.0"
isort = "^5.13.0"
flake8 = "^6.1.0"
mypy = "^1.7.0"
bandit = "^1.7.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--strict-markers --tb=short"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
