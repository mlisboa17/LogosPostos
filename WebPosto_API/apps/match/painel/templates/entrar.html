{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<section class="cartao estreito">
  <h1>Entrar</h1>
  <form method="post" action="/entrar">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Usuário <input name="login" autocomplete="username" required autofocus></label>
    <label>Senha <input name="senha" type="password" autocomplete="current-password" required></label>
    <label class="caixa"><input id="entrar-lembrar" type="checkbox" name="lembrar" value="1"> Manter conectado neste computador por 7 dias</label>
    <button type="submit">Entrar</button>
  </form>
  <p><a href="/esqueci">Esqueci minha senha</a></p>
</section>
{% endblock %}
