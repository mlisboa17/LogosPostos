{% extends "base.html" %}
{% block titulo %}Configurações{% endblock %}
{% block conteudo %}
<h1>Configurações</h1>
<table>
  <tbody>
  {% for url, rotulo, explicacao in itens %}
    <tr><td><a href="{{ url }}">{{ rotulo }}</a></td><td>{{ explicacao }}</td></tr>
  {% else %}<tr><td>Nada para configurar com o seu perfil.</td></tr>{% endfor %}
  </tbody>
</table>
{% endblock %}
